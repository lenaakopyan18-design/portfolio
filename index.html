<!DOCTYPE html>
<html lang="ka" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ელენე აკოფიანის პერსონალური პორტფოლიო - სკოლის მოსწავლე, მომავალი ვებ დეველოპერი">
    <title>ელენე აკოფიანი | პორტფოლიო (React)</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Dark mode & Custom Styles -->
    <style>
        html.dark {
            color-scheme: dark;
            background-color: #090912 !important;
        }
        html.dark body {
            background-color: #090912 !important;
            background-image: radial-gradient(at 0% 0%, rgba(88, 28, 135, 0.18) 0px, transparent 55%),
                              radial-gradient(at 100% 100%, rgba(219, 39, 119, 0.12) 0px, transparent 55%),
                              radial-gradient(at 50% 50%, rgba(30, 27, 75, 0.35) 0px, transparent 100%) !important;
            color: #cbd5e1 !important;
        }
    </style>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }

        // Apply dark mode immediately on load
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- React 18 & ReactDOM 18 UMD CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-gradient-to-br from-rose-50/50 via-purple-50/40 to-sky-50/60 dark:bg-[#090912] dark:from-[#090912] dark:via-[#0c0c18] dark:to-[#07070e] min-h-screen text-slate-700 dark:text-slate-300 antialiased font-sans leading-relaxed selection:bg-purple-200 selection:text-purple-900 dark:selection:bg-purple-900 dark:selection:text-purple-200 relative overflow-x-hidden transition-colors duration-300">

    <div id="root"></div>

    <!-- React Application Code with Routing & Components -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        /* ========================================================
           1. REUSABLE UI COMPONENTS (მრავალჯერადი კომპონენტები)
           ======================================================== */

        // Badge Component
        function Badge({ text, color = 'violet', pulse = false }) {
            const colorStyles = {
                violet: 'bg-violet-100/80 dark:bg-violet-950/70 text-violet-700 dark:text-violet-300 border-violet-200/60 dark:border-violet-800/60',
                emerald: 'bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 border-emerald-200/60 dark:border-emerald-800/40',
                amber: 'bg-amber-100 dark:bg-amber-950/80 text-amber-800 dark:text-amber-300 border-amber-200/60 dark:border-amber-800/40',
                sky: 'bg-sky-100/80 dark:bg-sky-950/70 text-sky-700 dark:text-sky-300 border-sky-200/60 dark:border-sky-800/60',
                pink: 'bg-pink-100 dark:bg-pink-950/80 text-pink-700 dark:text-pink-300 border-pink-200/60 dark:border-pink-800/40',
                indigo: 'bg-indigo-100 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300 border-indigo-200/60 dark:border-indigo-800/40',
            };
            const pulseColors = {
                violet: 'bg-violet-500',
                emerald: 'bg-emerald-500',
                amber: 'bg-amber-500',
                sky: 'bg-sky-500',
                pink: 'bg-pink-500',
                indigo: 'bg-indigo-500',
            };

            return (
                <span className={`inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold border ${colorStyles[color] || colorStyles.violet}`}>
                    {pulse && <span className={`w-2 h-2 rounded-full ${pulseColors[color] || 'bg-violet-500'} animate-pulse`}></span>}
                    {text}
                </span>
            );
        }

        // Section Container Component
        function Section({ id, badgeText, badgeColor = 'violet', title, subtitle, glowColor = 'pink', children, className = '' }) {
            const glowStyles = {
                pink: 'bg-gradient-to-br from-pink-300/30 to-violet-300/30 dark:from-pink-500/10 dark:to-violet-500/15',
                sky: 'bg-gradient-to-br from-sky-300/30 to-violet-300/30 dark:from-sky-500/10 dark:to-violet-500/15',
                amber: 'bg-gradient-to-br from-amber-300/30 to-pink-300/30 dark:from-amber-500/10 dark:to-pink-500/15',
                emerald: 'bg-gradient-to-br from-emerald-300/30 to-sky-300/30 dark:from-emerald-500/10 dark:to-sky-500/15',
                indigo: 'bg-gradient-to-br from-indigo-300/30 to-purple-300/30 dark:from-indigo-500/10 dark:to-purple-500/15',
            };

            return (
                <section id={id} className={`relative overflow-hidden bg-white/80 dark:bg-[#111122]/90 backdrop-blur-lg rounded-2xl sm:rounded-[2rem] p-6 sm:p-8 md:p-10 shadow-[0_10px_30px_-5px_rgba(139,92,246,0.05)] dark:shadow-[0_20px_50px_rgba(0,0,0,0.6)] border border-white dark:border-white/[0.08] hover:border-violet-200/60 dark:hover:border-violet-500/30 transition-all ${className}`}>
                    {glowStyles[glowColor] && (
                        <div className={`absolute -top-16 -right-16 w-40 sm:w-48 h-40 sm:h-48 rounded-full blur-2xl pointer-events-none ${glowStyles[glowColor]}`}></div>
                    )}
                    <header className="mb-6 sm:mb-8">
                        {badgeText && (
                            <div className="mb-2">
                                <Badge text={badgeText} color={badgeColor} pulse={true} />
                            </div>
                        )}
                        {title && <h2 className="text-xl sm:text-2xl md:text-3xl font-extrabold text-slate-800 dark:text-white">{title}</h2>}
                        {subtitle && <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">{subtitle}</p>}
                    </header>
                    {children}
                </section>
            );
        }

        // Loading Spinner Component
        function LoadingSpinner({ text = 'იტვირთება...' }) {
            return (
                <div className="flex items-center justify-center py-10 gap-3 text-slate-400 dark:text-slate-500">
                    <svg className="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                    </svg>
                    <span className="text-sm font-medium">{text}</span>
                </div>
            );
        }

        // Search Input Component (Reusable)
        function SearchInput({ value, onChange, placeholder = 'ძებნა...' }) {
            return (
                <div className="relative w-full">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input
                        type="text"
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        placeholder={placeholder}
                        className="w-full pl-10 pr-4 py-2.5 sm:py-3 rounded-xl border border-slate-200 dark:border-white/[0.1] bg-slate-50/70 dark:bg-[#0c0c16] text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/30 focus:border-violet-500 focus:bg-white dark:focus:bg-[#0c0c16] transition-all shadow-sm"
                    />
                    {value && (
                        <button
                            type="button"
                            onClick={() => onChange('')}
                            className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                        >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    )}
                </div>
            );
        }

        // Project Card Component
        function ProjectCard({ status, year, isCompleted, title, description, image, caption }) {
            return (
                <article className="group bg-gradient-to-b from-white to-violet-50/40 dark:from-[#17172e] dark:to-[#131326] rounded-2xl p-5 sm:p-6 border border-slate-200/80 dark:border-white/[0.08] hover:border-violet-300 dark:hover:border-violet-500/50 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                    <div>
                        <header className="mb-3 sm:mb-4">
                            <Badge text={`${status} • ${year}`} color={isCompleted ? 'emerald' : 'amber'} />
                            <h3 className="text-lg sm:text-xl font-bold text-slate-800 dark:text-white group-hover:text-violet-700 dark:group-hover:text-violet-400 transition-colors mt-2">
                                {title}
                            </h3>
                        </header>
                        <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-300 mb-4 sm:mb-5 leading-relaxed">
                            {description}
                        </p>
                    </div>
                    <figure className="overflow-hidden rounded-xl border border-slate-200/70 dark:border-white/[0.08] shadow-sm">
                        <img src={image} alt={title} className="w-full h-40 sm:h-48 object-cover group-hover:scale-105 transition-transform duration-300" />
                        <figcaption className="p-2 sm:p-2.5 text-[11px] sm:text-xs text-center font-medium text-slate-500 dark:text-slate-400 bg-white dark:bg-[#1a1a33]">
                            {caption}
                        </figcaption>
                    </figure>
                </article>
            );
        }

        // Employee Card Component (Reused for API Users)
        function EmployeeCard({ name, email }) {
            const firstLetter = name ? name.charAt(0).toUpperCase() : '?';
            return (
                <div className="flex items-center gap-4 p-4 rounded-2xl bg-slate-50/80 dark:bg-white/[0.04] border border-slate-200/60 dark:border-white/[0.07] hover:border-violet-200/60 dark:hover:border-violet-500/30 hover:shadow-md transition-all group">
                    <div className="w-11 h-11 rounded-xl bg-gradient-to-tr from-violet-500 via-pink-500 to-amber-400 flex items-center justify-center text-white font-bold text-base shadow-md flex-shrink-0">
                        {firstLetter}
                    </div>
                    <div className="min-w-0">
                        <p className="text-sm font-bold text-slate-800 dark:text-white truncate">{name}</p>
                        <a href={`mailto:${email}`} className="text-xs text-violet-600 dark:text-violet-400 hover:text-pink-600 dark:hover:text-pink-400 transition-colors truncate block">
                            {email}
                        </a>
                    </div>
                </div>
            );
        }

        // Post Card Component
        function PostCard({ id, title, body }) {
            return (
                <div className="p-5 rounded-2xl bg-slate-50/80 dark:bg-white/[0.04] border border-slate-200/60 dark:border-white/[0.07] hover:border-amber-200/60 dark:hover:border-amber-500/30 hover:shadow-md transition-all">
                    <div className="flex items-start gap-3 mb-2">
                        <span className="mt-0.5 w-6 h-6 rounded-lg bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xs font-bold flex-shrink-0">
                            {id}
                        </span>
                        <h3 className="text-sm font-bold text-slate-800 dark:text-white capitalize leading-snug">
                            {title}
                        </h3>
                    </div>
                    <p className="text-xs text-slate-500 dark:text-slate-400 leading-relaxed pl-9">
                        {body}
                    </p>
                </div>
            );
        }

        // Comment Card Component
        function CommentCard({ name, email, body }) {
            const firstLetter = name ? name.charAt(0).toUpperCase() : '?';
            return (
                <div className="p-5 rounded-2xl bg-slate-50/80 dark:bg-white/[0.04] border border-slate-200/60 dark:border-white/[0.07] hover:border-emerald-200/60 dark:hover:border-emerald-500/30 hover:shadow-md transition-all">
                    <div className="flex items-center gap-3 mb-2">
                        <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-emerald-500 to-sky-500 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">
                            {firstLetter}
                        </div>
                        <div className="min-w-0">
                            <p className="text-sm font-bold text-slate-800 dark:text-white truncate capitalize">{name}</p>
                            <a href={`mailto:${email}`} className="text-xs text-emerald-600 dark:text-emerald-400 hover:text-pink-600 dark:hover:text-pink-400 transition-colors truncate block">
                                {email}
                            </a>
                        </div>
                    </div>
                    <p className="text-xs text-slate-500 dark:text-slate-400 leading-relaxed pl-11">
                        {body}
                    </p>
                </div>
            );
        }

        // Todo Card Component (For the /todos Resource with interactive toggle)
        function TodoCard({ id, title, completed, onToggle }) {
            return (
                <div
                    onClick={onToggle}
                    role="button"
                    tabIndex={0}
                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onToggle(); } }}
                    title="დააჭირეთ სტატუსის შესაცვლელად (შესრულებული / მიმდინარე)"
                    className="flex items-start gap-3.5 p-4 rounded-2xl bg-slate-50/80 dark:bg-white/[0.04] border border-slate-200/60 dark:border-white/[0.07] hover:border-indigo-300 dark:hover:border-indigo-500/40 hover:shadow-md hover:scale-[1.01] active:scale-[0.99] transition-all cursor-pointer select-none group"
                >
                    <div className={`mt-0.5 w-6 h-6 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0 transition-colors ${
                        completed
                            ? 'bg-emerald-100 dark:bg-emerald-950/80 text-emerald-600 dark:text-emerald-400 border border-emerald-200/60 dark:border-emerald-800/40'
                            : 'bg-amber-100 dark:bg-amber-950/80 text-amber-600 dark:text-amber-400 border border-amber-200/60 dark:border-amber-800/40'
                    }`}>
                        {completed ? '✓' : '○'}
                    </div>
                    <div className="min-w-0 flex-1">
                        <div className="flex items-center justify-between gap-2">
                            <span className="text-[11px] font-bold text-slate-400 dark:text-slate-500">#{id}</span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full transition-colors ${
                                completed
                                    ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-300'
                                    : 'bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-300'
                            }`}>
                                {completed ? 'შესრულებული' : 'მიმდინარე'}
                            </span>
                        </div>
                        <p className={`text-xs sm:text-sm font-medium mt-1 capitalize leading-relaxed transition-all ${
                            completed
                                ? 'line-through text-slate-400 dark:text-slate-500'
                                : 'text-slate-700 dark:text-slate-200'
                        }`}>
                            {title}
                        </p>
                    </div>
                </div>
            );
        }

        // Experience Card Component
        function ExperienceCard({ icon, title, subtitle, description, borderColor = 'border-violet-500' }) {
            return (
                <article className={`p-4 sm:p-6 rounded-2xl bg-gradient-to-r from-violet-50/80 to-white dark:from-[#17172e] dark:to-[#131326] border-l-4 ${borderColor} border border-slate-200/70 dark:border-white/[0.08] hover:shadow-sm transition-all`}>
                    <header className="mb-1.5 sm:mb-2">
                        <h3 className="text-base sm:text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                            <span>{icon}</span> {title}
                        </h3>
                        {subtitle && (
                            <p className="text-[11px] sm:text-xs text-sky-700 dark:text-sky-300 font-semibold mt-0.5">{subtitle}</p>
                        )}
                    </header>
                    <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed mt-1">
                        {description}
                    </p>
                </article>
            );
        }


        /* ========================================================
           2. NAVIGATION & HEADER
           ======================================================== */

        function Header({ darkMode, toggleTheme, currentPage, setCurrentPage }) {
            const [isNavOpen, setIsNavOpen] = useState(false);
            const [isSectionsMenuOpen, setIsSectionsMenuOpen] = useState(false);

            const homeNavLinks = [
                { href: '#about', label: 'ჩემ შესახებ', icon: '👤' },
                { href: '#interests', label: 'ინტერესები', icon: '💡' },
                { href: '#projects', label: 'პროექტები', icon: '💻' },
                { href: '#experience', label: 'გამოცდილება', icon: '🌱' },
                { href: '#employees', label: 'თანამშრომლები', icon: '👥' },
                { href: '#posts', label: 'პოსტები', icon: '📝' },
                { href: '#comments', label: 'კომენტარები', icon: '💬' },
                { href: '#contact', label: 'კონტაქტი', icon: '✉️' },
            ];

            const navigate = (page, anchor = null) => {
                setCurrentPage(page);
                setIsNavOpen(false);
                setIsSectionsMenuOpen(false);
                if (anchor) {
                    setTimeout(() => {
                        const el = document.querySelector(anchor);
                        if (el) el.scrollIntoView({ behavior: 'smooth' });
                    }, 60);
                } else {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            const handleBurgerClick = (e) => {
                const nextState = !isNavOpen;
                setIsNavOpen(nextState);
                console.log('Burger menu clicked!', {
                    timestamp: new Date().toISOString(),
                    isOpen: nextState,
                    event: e
                });
            };

            return (
                <header id="header" className="sticky top-0 z-50 backdrop-blur-xl bg-white/80 dark:bg-[#0e0e1a]/85 border-b border-white/70 dark:border-white/[0.08] shadow-[0_4px_20px_-4px_rgba(139,92,246,0.06)] dark:shadow-[0_8px_30px_rgba(0,0,0,0.5)] transition-all">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5">
                        <div className="flex items-center justify-between gap-4">
                            
                            {/* Logo */}
                            <button
                                type="button"
                                onClick={() => navigate('home')}
                                className="flex items-center gap-2.5 group flex-shrink-0 text-left cursor-pointer"
                            >
                                <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-violet-600 via-pink-500 to-amber-400 flex items-center justify-center text-white font-bold text-sm sm:text-base shadow-md shadow-violet-500/25 group-hover:scale-105 transition-transform">
                                    EA
                                </div>
                                <div>
                                    <h1 className="text-base sm:text-lg font-extrabold bg-gradient-to-r from-violet-600 via-pink-600 to-amber-500 bg-clip-text text-transparent leading-none">
                                        ელენე აკოფიანი
                                    </h1>
                                    <p className="text-[10px] sm:text-[11px] text-slate-500 dark:text-slate-400 font-medium mt-0.5">სკოლის მოსწავლე &bull; ვებ ენთუზიასტი ✨</p>
                                </div>
                            </button>

                            {/* Right side: Nav + Page Switcher + Theme Toggle + Burger */}
                            <div className="flex items-center gap-2 sm:gap-3 flex-shrink-0">
                                <nav aria-label="მთავარი ნავიგაცია" className={`nav-menu absolute md:static top-full left-0 w-full md:w-auto bg-white/95 dark:bg-[#121222]/95 md:bg-transparent dark:md:bg-transparent backdrop-blur-xl md:backdrop-blur-none border-b md:border-0 border-slate-200/80 dark:border-white/10 shadow-lg md:shadow-none p-4 md:p-0 transition-all ${isNavOpen ? 'block' : 'hidden md:block'}`}>
                                    <ul className="flex flex-col md:flex-row md:items-center gap-1.5 sm:gap-2 text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-300">
                                        
                                        {/* Home Page Link - Acts as Toggle for Sections Menu */}
                                        <li className="relative">
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    if (currentPage !== 'home') {
                                                        setCurrentPage('home');
                                                        window.scrollTo({ top: 0, behavior: 'smooth' });
                                                    }
                                                    setIsSectionsMenuOpen(!isSectionsMenuOpen);
                                                }}
                                                className={`w-full text-left md:text-center block px-3 py-1.5 rounded-xl transition-all whitespace-nowrap cursor-pointer flex items-center justify-between md:justify-center gap-1.5 ${
                                                    currentPage === 'home'
                                                        ? 'bg-violet-100 dark:bg-violet-950/70 text-violet-700 dark:text-violet-300 font-bold'
                                                        : 'hover:text-violet-600 dark:hover:text-violet-400 hover:bg-violet-50/80 dark:hover:bg-white/[0.06]'
                                                }`}
                                            >
                                                <span>🏠 მთავარი</span>
                                                <svg className={`w-3.5 h-3.5 transition-transform duration-200 ${isSectionsMenuOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                                                </svg>
                                            </button>

                                            {/* Dropdown Menu with Sections List */}
                                            {isSectionsMenuOpen && (
                                                <div className="md:absolute top-full left-0 mt-2 w-56 bg-white dark:bg-[#151528] rounded-2xl shadow-xl border border-slate-200/80 dark:border-white/[0.1] p-2 z-50 animate-in fade-in slide-in-from-top-2 duration-150">
                                                    <div className="px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 border-b border-slate-100 dark:border-white/[0.06] mb-1">
                                                        სექციები
                                                    </div>
                                                    <div className="space-y-0.5">
                                                        {homeNavLinks.map((link) => (
                                                            <button
                                                                key={link.href}
                                                                type="button"
                                                                onClick={() => navigate('home', link.href)}

                                    <span className="p-2 rounded-xl bg-pink-50 dark:bg-pink-950/60 text-pink-600 dark:text-pink-400">📍</span>
                                    <div>
                                        <span className="block text-[11px] text-slate-400 font-medium">მდებარეობა</span>
                                        <span className="font-bold text-slate-700 dark:text-slate-200">თბილისი, საქართველო</span>
                                    </div>
                                </div>
                            </div>
                        </address>

                        <div className="md:col-span-2 bg-white dark:bg-[#16162c] p-5 sm:p-6 md:p-8 rounded-2xl border border-slate-100 dark:border-white/[0.08] shadow-sm">
                            <form onSubmit={(e) => { e.preventDefault(); alert('შეტყობინება წარმატებით გაიგზავნა! ✨'); }} className="space-y-3.5 sm:space-y-4">
                                <fieldset className="border-0 p-0 m-0 space-y-3.5 sm:space-y-4">
                                    <legend className="sr-only">საკონტაქტო ფორმა</legend>

                                    <div>
                                        <label htmlFor="name" className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">თქვენი სახელი</label>
                                        <input type="text" id="name" name="name" required placeholder="მაგ: მარიამი"
                                            className="w-full px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-xl border border-slate-200 dark:border-white/[0.1] bg-slate-50/50 dark:bg-[#0c0c16] text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/30 focus:border-violet-500 focus:bg-white dark:focus:bg-[#0c0c16] transition-all" />
                                    </div>

                                    <div>
                                        <label htmlFor="email" className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">ელექტრონული ფოსტა</label>
                                        <input type="email" id="email" name="email" required placeholder="name@example.com"
                                            className="w-full px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-xl border border-slate-200 dark:border-white/[0.1] bg-slate-50/50 dark:bg-[#0c0c16] text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/30 focus:border-violet-500 focus:bg-white dark:focus:bg-[#0c0c16] transition-all" />
                                    </div>

                                    <div>
                                        <label htmlFor="message" className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">შეტყობინება</label>
                                        <textarea id="message" name="message" rows="4" required placeholder="დაწერეთ თქვენი აზრი ან რჩევა..."
                                            className="w-full px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-xl border border-slate-200 dark:border-white/[0.1] bg-slate-50/50 dark:bg-[#0c0c16] text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/30 focus:border-violet-500 focus:bg-white dark:focus:bg-[#0c0c16] transition-all"></textarea>
                                    </div>

                                    <div className="flex flex-wrap sm:flex-nowrap items-center gap-2.5 sm:gap-3 pt-1">
                                        <button type="submit"
                                            className="w-full sm:w-auto px-6 py-2.5 sm:py-3 rounded-xl bg-gradient-to-r from-violet-600 to-pink-500 text-white text-xs sm:text-sm font-bold shadow-md shadow-pink-500/20 hover:shadow-lg hover:shadow-pink-500/30 hover:scale-[1.02] active:scale-[0.98] transition-all">
                                            შეტყობინების გაგზავნა ✨
                                        </button>
                                        <button type="reset"
                                            className="w-full sm:w-auto px-4 py-2.5 sm:py-3 rounded-xl bg-slate-100 dark:bg-white/[0.08] text-slate-600 dark:text-slate-300 text-xs sm:text-sm font-medium hover:bg-slate-200 dark:hover:bg-white/[0.14] transition-colors">
                                            გასუფთავება
                                        </button>
                                    </div>
                                </fieldset>
                            </form>
                        </div>
                    </div>
                </section>
            );
        }

        // Employees Section (With Search Functionality!)
        function EmployeesSection() {
            const [employees, setEmployees] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                fetch('https://jsonplaceholder.typicode.com/users')
                    .then(res => res.json())
                    .then(data => {
                        setEmployees(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error('შეცდომა API-სთან:', err);
                        setError('მონაცემების ჩატვირთვა ვერ მოხერხდა');
                        setLoading(false);
                    });
            }, []);

            // Search filtering by name or email
            const filteredEmployees = useMemo(() => {
                if (!searchTerm.trim()) return employees;
                const lower = searchTerm.toLowerCase();
                return employees.filter(emp =>
                    emp.name.toLowerCase().includes(lower) ||
                    emp.email.toLowerCase().includes(lower)
                );
            }, [employees, searchTerm]);

            return (
                <Section id="employees" badgeText="API მონაცემები" badgeColor="sky" title="თანამშრომლები 👥" glowColor="sky">
                    <div className="mb-6 max-w-md">
                        <SearchInput
                            value={searchTerm}
                            onChange={setSearchTerm}
                            placeholder="მოძებნე თანამშრომელი სახელით ან იმეილით..."
                        />
                    </div>

                    {loading && <LoadingSpinner />}
                    {error && <p className="text-red-500 text-sm text-center py-6">⚠️ {error}</p>}
                    {!loading && !error && (
                        <div>
                            {filteredEmployees.length === 0 ? (
                                <p className="text-slate-400 dark:text-slate-500 text-sm text-center py-8">
                                    თანამშრომელი ვერ მოიძებნა &ldquo;{searchTerm}&rdquo;
                                </p>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {filteredEmployees.map(user => (
                                        <EmployeeCard key={user.id} name={user.name} email={user.email} />
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </Section>
            );
        }

        // Posts Section (Fetches first 5 JSONPlaceholder Posts)
        function PostsSection() {
            const [posts, setPosts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                fetch('https://jsonplaceholder.typicode.com/posts')
                    .then(res => res.json())
                    .then(data => {
                        const first5 = data.slice(0, 5);
                        setPosts(first5);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error('შეცდომა პოსტების ჩატვირთვაში:', err);
                        setError('პოსტების ჩატვირთვა ვერ მოხერხდა');
                        setLoading(false);
                    });
            }, []);

            return (
                <Section id="posts" badgeText="API მონაცემები" badgeColor="amber" title="პოსტები 📝" glowColor="amber">
                    {loading && <LoadingSpinner />}
                    {error && <p className="text-red-500 text-sm text-center py-6">⚠️ {error}</p>}
                    {!loading && !error && (
                        <div className="space-y-4">
                            {posts.map(post => (
                                <PostCard key={post.id} id={post.id} title={post.title} body={post.body} />
                            ))}
                        </div>
                    )}
                </Section>
            );
        }

        // Comments Section (Fetches first 5 JSONPlaceholder Comments)
        function CommentsSection() {
            const [comments, setComments] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                fetch('https://jsonplaceholder.typicode.com/comments')
                    .then(res => res.json())
                    .then(data => {
                        const first5 = data.slice(0, 5);
                        setComments(first5);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error('შეცდომა კომენტარების ჩატვირთვაში:', err);
                        setError('კომენტარების ჩატვირთვა ვერ მოხერხდა');
                        setLoading(false);
                    });
            }, []);

            return (
                <Section id="comments" badgeText="API მონაცემები" badgeColor="emerald" title="კომენტარები 💬" glowColor="emerald">
                    {loading && <LoadingSpinner />}
                    {error && <p className="text-red-500 text-sm text-center py-6">⚠️ {error}</p>}
                    {!loading && !error && (
                        <div className="space-y-4">
                            {comments.map(comment => (
                                <CommentCard key={comment.id} name={comment.name} email={comment.email} body={comment.body} />
                            ))}
                        </div>
                    )}
                </Section>
            );
        }


        /* ========================================================
           4. PAGE: TODOS / TASKS
           ======================================================== */

        function TodosPage({ onBackToHome }) {
            const [todos, setTodos] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [filter, setFilter] = useState('all'); // 'all', 'completed', 'pending'
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // Fetch https://jsonplaceholder.typicode.com/todos
            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                fetch('https://jsonplaceholder.typicode.com/todos?_limit=30')
                    .then(res => res.json())
                    .then(data => {
                        console.log('Todos API Data:', data);
                        setTodos(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error('შეცდომა Todos-ის ჩატვირთვაში:', err);
                        setError('დავალებების ჩატვირთვა ვერ მოხერხდა');
                        setLoading(false);
                    });
            }, []);

            // Toggle todo completion status (შესრულებული <-> მიმდინარე)
            const handleToggleTodo = (id) => {
                setTodos(prevTodos =>
                    prevTodos.map(todo =>
                        todo.id === id ? { ...todo, completed: !todo.completed } : todo
                    )
                );
            };

            // Search & Filter
            const filteredTodos = useMemo(() => {
                return todos.filter(todo => {
                    const matchesSearch = todo.title.toLowerCase().includes(searchTerm.toLowerCase());
                    if (filter === 'completed') return matchesSearch && todo.completed;
                    if (filter === 'pending') return matchesSearch && !todo.completed;
                    return matchesSearch;
                });
            }, [todos, searchTerm, filter]);

            const stats = useMemo(() => {
                const total = todos.length;
                const completed = todos.filter(t => t.completed).length;
                const pending = total - completed;
                return { total, completed, pending };
            }, [todos]);

            return (
                <div className="space-y-6 sm:space-y-8">
                    {/* Header Banner */}
                    <div className="relative overflow-hidden bg-gradient-to-br from-indigo-500/10 via-purple-500/10 to-pink-500/10 dark:from-indigo-950/40 dark:via-purple-950/30 dark:to-pink-950/20 backdrop-blur-lg rounded-2xl sm:rounded-[2rem] p-6 sm:p-10 border border-indigo-200/60 dark:border-white/[0.08] shadow-[0_10px_30px_-5px_rgba(99,102,241,0.08)]">
                        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                            <div>
                                <button
                                    type="button"
                                    onClick={onBackToHome}
                                    className="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:text-pink-600 dark:hover:text-pink-300 transition-colors mb-3 cursor-pointer"
                                >
                                    <span>&larr;</span> მთავარ გვერდზე დაბრუნება
                                </button>
                                <div className="mb-2">
                                    <Badge text="დავალებების მართვა" color="indigo" pulse={true} />
                                </div>
                                <h1 className="text-2xl sm:text-3xl md:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                                    დავალებების სია 📋
                                </h1>
                            </div>

                            {/* Mini Stats Card */}
                            <div className="flex gap-2 sm:gap-3 flex-wrap">
                                <div className="bg-white/80 dark:bg-white/[0.06] backdrop-blur-md px-3.5 py-2.5 rounded-xl border border-slate-200/60 dark:border-white/[0.08] text-center">
                                    <span className="block text-lg font-extrabold text-slate-800 dark:text-white">{stats.total}</span>
                                    <span className="text-[10px] text-slate-500 dark:text-slate-400 font-semibold uppercase">სულ</span>
                                </div>
                                <div className="bg-emerald-50 dark:bg-emerald-950/40 px-3.5 py-2.5 rounded-xl border border-emerald-200/60 dark:border-emerald-800/40 text-center">
                                    <span className="block text-lg font-extrabold text-emerald-600 dark:text-emerald-400">{stats.completed}</span>
                                    <span className="text-[10px] text-emerald-700 dark:text-emerald-300 font-semibold uppercase">შესრულებული</span>
                                </div>
                                <div className="bg-amber-50 dark:bg-amber-950/40 px-3.5 py-2.5 rounded-xl border border-amber-200/60 dark:border-amber-800/40 text-center">
                                    <span className="block text-lg font-extrabold text-amber-600 dark:text-amber-400">{stats.pending}</span>
                                    <span className="text-[10px] text-amber-700 dark:text-amber-300 font-semibold uppercase">მიმდინარე</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Search & Filter Bar */}
                    <div className="bg-white/80 dark:bg-[#111122]/90 backdrop-blur-lg rounded-2xl p-4 sm:p-6 border border-white dark:border-white/[0.08] shadow-sm flex flex-col md:flex-row items-center gap-3">
                        <div className="w-full md:flex-1">
                            <SearchInput
                                value={searchTerm}
                                onChange={setSearchTerm}
                                placeholder="მოძებნე დავალება სათაურით..."
                            />
                        </div>

                        {/* Filter Tabs */}
                        <div className="flex items-center gap-1.5 w-full md:w-auto bg-slate-100 dark:bg-white/[0.06] p-1 rounded-xl flex-shrink-0">
                            <button
                                type="button"
                                onClick={() => setFilter('all')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex-1 md:flex-none cursor-pointer ${
                                    filter === 'all'
                                        ? 'bg-white dark:bg-violet-600 text-slate-800 dark:text-white shadow-sm'
                                        : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white'
                                }`}
                            >
                                ყველა ({stats.total})
                            </button>
                            <button
                                type="button"
                                onClick={() => setFilter('completed')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex-1 md:flex-none cursor-pointer ${
                                    filter === 'completed'
                                        ? 'bg-emerald-500 text-white shadow-sm'
                                        : 'text-slate-500 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400'
                                }`}
                            >
                                ✓ შესრულებული ({stats.completed})
                            </button>
                            <button
                                type="button"
                                onClick={() => setFilter('pending')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex-1 md:flex-none cursor-pointer ${
                                    filter === 'pending'
                                        ? 'bg-amber-500 text-white shadow-sm'
                                        : 'text-slate-500 dark:text-slate-400 hover:text-amber-600 dark:hover:text-amber-400'
                                }`}
                            >
                                ○ მიმდინარე ({stats.pending})
                            </button>
                        </div>
                    </div>

                    {/* Todos Grid */}
                    {loading && <LoadingSpinner text="დავალებები იტვირთება..." />}
                    {error && <p className="text-red-500 text-sm text-center py-10">⚠️ {error}</p>}
                    {!loading && !error && (
                        <div>
                            {filteredTodos.length === 0 ? (
                                <div className="text-center py-16 bg-white/60 dark:bg-white/[0.02] rounded-2xl border border-dashed border-slate-200 dark:border-white/[0.08]">
                                    <p className="text-2xl mb-2">🔍</p>
                                    <p className="text-slate-600 dark:text-slate-400 text-sm font-semibold">
                                        დავალება ვერ მოიძებნა
                                    </p>
                                    <p className="text-slate-400 dark:text-slate-500 text-xs mt-1">
                                        სცადეთ სხვა საძიებო სიტყვა ან შეცვალეთ ფილტრი
                                    </p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 sm:gap-4">
                                    {filteredTodos.map(todo => (
                                        <TodoCard
                                            key={todo.id}
                                            id={todo.id}
                                            title={todo.title}
                                            completed={todo.completed}
                                            onToggle={() => handleToggleTodo(todo.id)}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // Footer Component
        function Footer() {
            return (
                <footer id="footer" className="border-t border-slate-200/60 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 backdrop-blur-md py-6 sm:py-8 mt-12 sm:mt-16 transition-colors">
                    <div className="max-w-5xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left text-xs text-slate-500 dark:text-slate-400 font-semibold">
                        <p>&copy; 2026 ელენე აკოფიანი. შექმნილია სიყვარულით და ინტერესით 💜</p>
                        <a href="#header" className="text-violet-600 dark:text-violet-400 hover:text-pink-600 dark:hover:text-pink-400 transition-colors flex items-center gap-1.5 py-1 px-3 rounded-lg hover:bg-violet-50 dark:hover:bg-slate-800">
                            <span>ზემოთ დაბრუნება</span>
                            <span>&uarr;</span>
                        </a>
                    </div>
                </footer>
            );
        }


        /* ========================================================
           5. MAIN APP COMPONENT (მთავარი აპლიკაცია)
           ======================================================== */

        function App() {
            const [currentPage, setCurrentPage] = useState('home'); // 'home' | 'todos'
            const [darkMode, setDarkMode] = useState(() => {
                return localStorage.getItem('theme') === 'dark' ||
                    (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            });

            const toggleTheme = () => {
                const nextDark = !darkMode;
                setDarkMode(nextDark);
                if (nextDark) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            };

            return (
                <React.Fragment>
                    {/* Decorative Background Orbs */}
                    <div className="fixed top-10 left-5 sm:left-10 w-72 sm:w-96 h-72 sm:h-96 bg-purple-200/40 dark:bg-purple-900/15 rounded-full blur-3xl pointer-events-none -z-10 transition-colors"></div>
                    <div className="fixed top-1/3 right-5 sm:right-10 w-72 sm:w-96 h-72 sm:h-96 bg-rose-200/40 dark:bg-pink-900/10 rounded-full blur-3xl pointer-events-none -z-10 transition-colors"></div>
                    <div className="fixed bottom-10 left-1/4 w-72 sm:w-96 h-72 sm:h-96 bg-sky-200/40 dark:bg-indigo-900/15 rounded-full blur-3xl pointer-events-none -z-10 transition-colors"></div>

                    {/* Header */}
                    <Header
                        darkMode={darkMode}
                        toggleTheme={toggleTheme}
                        currentPage={currentPage}
                        setCurrentPage={setCurrentPage}
                    />

                    {/* Main Content Area */}
                    <main id="main-content" className="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12 space-y-10 sm:space-y-14">
                        {currentPage === 'home' ? (
                            <React.Fragment>
                                <AboutSection />
                                <InterestsSection />
                                <ProjectsSection />
                                <ExperienceSection />
                                <EmployeesSection />
                                <PostsSection />
                                <CommentsSection />
                                <ContactSection />
                            </React.Fragment>
                        ) : (
                            <TodosPage onBackToHome={() => setCurrentPage('home')} />
                        )}
                    </main>

                    {/* Footer */}
                    <Footer />
                </React.Fragment>
            );
        }

        // Mount the React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
